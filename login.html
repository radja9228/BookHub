<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk — BookHub</title>
    <meta name="description" content="Masuk ke akun BookHub Anda untuk membayar lebih cepat dan melacak pesanan Anda." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="header-mount"></div>

    <main>
      <div class="center-page">
        <div class="form-card narrow">
          <h1 style="text-align:center">Selamat datang kembali</h1>
          <p style="text-align:center;color:var(--ink-500);margin-bottom:22px">Masuk ke akun BookHub Anda</p>

          <div class="prototype-note">
            <span>&#128274;</span>
            <div><strong>Masuk prototipe</strong>Belum ada autentikasi backend sungguhan yang terhubung. Gunakan admin@bookhub.com / admin123 untuk Admin atau customer@gmail.com / user123 untuk Customer.</div>
          </div>

          <div class="alert alert-error" id="form-alert" hidden></div>

          <form id="login-form" novalidate>
            <div class="form-group">
              <label for="email">Email</label>
              <input class="form-control" id="email" name="email" type="email" placeholder="anda@contoh.com" required />
              <div class="field-error" data-error-for="email"></div>
            </div>
            <div class="form-group">
              <label for="password">Kata sandi</label>
              <div class="password-field">
                <input class="form-control" id="password" name="password" type="password" placeholder="Kata sandi Anda" required />
                <button type="button" class="toggle-pw" data-toggle="password">Tampilkan</button>
              </div>
              <div class="field-error" data-error-for="password"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Masuk</button>
          </form>
          <p class="form-foot">Belum punya akun? <a href="register.html">Buat akun</a></p>
        </div>
      </div>
    </main>

    <div id="footer-mount"></div>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
