<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — BookHub</title>
    <meta name="description" content="Log in to your BookHub account to check out faster and track your orders." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="header-mount"></div>

    <main>
      <div class="center-page">
        <div class="form-card narrow">
          <h1 style="text-align:center">Welcome back</h1>
          <p style="text-align:center;color:var(--ink-500);margin-bottom:22px">Log in to your BookHub account</p>

          <div class="prototype-note">
            <span>&#128274;</span>
            <div><strong>Prototype login</strong>No real backend authentication is connected yet. Logging in only marks you as signed in on this device for the prototype.</div>
          </div>

          <div class="alert alert-error" id="form-alert" hidden></div>

          <form id="login-form" novalidate>
            <div class="form-group">
              <label for="email">Email</label>
              <input class="form-control" id="email" name="email" type="email" placeholder="you@example.com" required />
              <div class="field-error" data-error-for="email"></div>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="password-field">
                <input class="form-control" id="password" name="password" type="password" placeholder="Your password" required />
                <button type="button" class="toggle-pw" data-toggle="password">Show</button>
              </div>
              <div class="field-error" data-error-for="password"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Log in</button>
          </form>
          <p class="form-foot">Don't have an account? <a href="register.html">Create one</a></p>
        </div>
      </div>
    </main>

    <div id="footer-mount"></div>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
