<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jelajahi Buku — BookHub</title>
    <meta name="description" content="Jelajahi katalog BookHub. Cari berdasarkan judul atau penulis, saring berdasarkan kategori, dan urutkan berdasarkan harga atau judul." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="header-mount"></div>

    <main>
      <div class="page-head">
        <div class="container">
          <h1>Jelajahi Buku</h1>
          <p>Jelajahi seluruh koleksi kami. Cari berdasarkan judul atau penulis, saring berdasarkan kategori, dan urutkan untuk menemukan persis yang Anda cari.</p>
        </div>
      </div>

      <div class="container">
        <div class="breadcrumbs"><a href="index.html">Beranda</a><span class="sep">/</span>Jelajahi Buku</div>

        <div class="catalog-layout">
          <!-- Filters sidebar -->
          <aside class="filters" id="filters">
            <div class="filter-group">
              <div class="label">Kategori</div>
              <ul class="filter-list" id="category-filters"></ul>
            </div>
            <button class="btn btn-ghost btn-sm btn-block" id="clear-filters">Hapus semua filter</button>
          </aside>

          <!-- Catalog main -->
          <div class="catalog-main">
            <div class="toolbar">
              <div class="search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="search" id="search-input" placeholder="Cari berdasarkan judul atau penulis…" aria-label="Cari buku" />
              </div>
              <select class="sort-select" id="sort-select" aria-label="Urutkan buku">
                <option value="default">Urutan: Bawaan</option>
                <option value="price-asc">Harga: Terendah ke Tertinggi</option>
                <option value="price-desc">Harga: Tertinggi ke Terendah</option>
                <option value="title-asc">Judul: A ke Z</option>
                <option value="title-desc">Judul: Z ke A</option>
              </select>
            </div>

            <div class="catalog-results-head">
              <span class="count" id="result-count"></span>
            </div>

            <div class="book-grid" id="book-grid"></div>

            <div class="empty-state hidden" id="empty-state">
              <div class="emoji">&#128218;</div>
              <h3>Buku tidak ditemukan</h3>
              <p>Coba kata kunci lain, ganti kategori, atau hapus filter Anda.</p>
              <button class="btn btn-outline btn-sm" id="empty-clear" style="margin-top:14px">Hapus filter</button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="footer-mount"></div>
    <script type="module" src="/js/catalog.js"></script>
  </body>
</html>
