<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — BookHub</title>
    <meta name="description" content="Create a free BookHub account to check out faster and track your orders." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="header-mount"></div>

    <main>
      <div class="center-page">
        <div class="form-card narrow">
          <h1 style="text-align:center">Create your account</h1>
          <p style="text-align:center;color:var(--ink-500);margin-bottom:22px">Join BookHub to check out faster and track orders</p>

          <div class="prototype-note">
            <span>&#128272;</span>
            <div><strong>Prototype registration</strong>No real backend authentication is connected yet. Your account is saved only on this device for the prototype. We do not store plain-text passwords.</div>
          </div>

          <div class="alert alert-error" id="form-alert" hidden></div>

          <form id="register-form" novalidate>
            <div class="form-group">
              <label for="name">Full name</label>
              <input class="form-control" id="name" name="name" type="text" placeholder="Your full name" required />
              <div class="field-error" data-error-for="name"></div>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input class="form-control" id="email" name="email" type="email" placeholder="you@example.com" required />
              <div class="field-error" data-error-for="email"></div>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="password-field">
                <input class="form-control" id="password" name="password" type="password" placeholder="At least 6 characters" required />
                <button type="button" class="toggle-pw" data-toggle="password">Show</button>
              </div>
              <div class="field-error" data-error-for="password"></div>
            </div>
            <div class="form-group">
              <label for="confirm">Confirm password</label>
              <div class="password-field">
                <input class="form-control" id="confirm" name="confirm" type="password" placeholder="Re-enter your password" required />
                <button type="button" class="toggle-pw" data-toggle="confirm">Show</button>
              </div>
              <div class="field-error" data-error-for="confirm"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
          </form>
          <p class="form-foot">Already have an account? <a href="login.html">Log in</a></p>
        </div>
      </div>
    </main>

    <div id="footer-mount"></div>
    <script type="module" src="/js/auth.js"></script>
  </body>
</html>
